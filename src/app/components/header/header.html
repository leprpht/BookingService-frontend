<mat-toolbar>
  <div>
    <span role="button" tabindex="0" (click)="goHome()" (keyup.enter)="goHome()"
      >Booking Service</span
    >
    <section>
      <button matButton="elevated" (click)="goRegister()" (keyup.enter)="goRegister()">Register</button>
      <button matButton="elevated" (click)="goLogin()" (keyup.enter)="goLogin()">Log in</button>
    </section>
  </div>
  @if (showSearchContainer()) {
    <booking-service-search-container />
  }
</mat-toolbar>
