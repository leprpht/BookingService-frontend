<mat-toolbar>
  <div>
    <span role="button" tabindex="0" (click)="goHome()" (keyup.enter)="goHome()"
      >Booking Service</span
    >
    @if (showProfileNavigation()) {
      @if (showAuthButtons()) {
        <booking-service-header-auth-buttons />
      } @else {
        <booking-service-header-profile-button [user]="user()!" />
      }
    }
  </div>
  @if (showSearchContainer()) {
    <booking-service-search-container />
  }
</mat-toolbar>
