<form [formGroup]="filterForm" (ngSubmit)="onSearch()">
  <booking-service-search-bar [form]="filterForm" />

  <mat-accordion class="additional-filters-accordion">
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Additional filters</mat-panel-title>
      </mat-expansion-panel-header>

      <booking-service-search-container-tags [form]="filterForm" />
      <booking-service-search-container-city [form]="filterForm" />
      <booking-service-search-container-country [form]="filterForm" />

      <!-- Price range -->
      <div class="price-range-inputs">
        <div class="label-container">
          <span class="name-label"><strong>Budget (per night):</strong></span>
          <span class="value-label">{{ ` ${priceString}` }}</span>
        </div>
        <mat-slider min="10" max="210" step="5">
          <input matSliderStartThumb formControlName="minPrice" />
          <input matSliderEndThumb formControlName="maxPrice" />
        </mat-slider>
      </div>

      <!-- Min rating -->
      <div class="min-rating-container">
        <div class="label-container">
          <span class="name-label"><strong>Minimum rating</strong></span>
        </div>
        <mat-button-toggle-group class="rating-toggle-group">
          @for (rating of ratingOptions; track rating) {
            <mat-button-toggle
              [value]="rating"
              [checked]="filterForm.controls.minRating.value === rating"
              (change)="setMinRating(rating)"
            >
              @if (rating === 10) {
                {{ rating }}
              } @else {
                {{ rating }}+
              }
            </mat-button-toggle>
          }
        </mat-button-toggle-group>
      </div>

      <!-- Capacities -->
      <div class="capacities-container">
        <div class="label-container">
          <span class="name-label"><strong>Guests</strong></span>
        </div>
        <mat-button-toggle-group multiple class="capacity-toggle-group">
          @for (cap of capacityOptions; track cap) {
            <mat-button-toggle
              [value]="cap"
              [checked]="isCapacitySelected(cap)"
              (change)="toggleCapacity(cap)"
            >
              {{ cap === 8 ? '8+' : cap }}
            </mat-button-toggle>
          }
        </mat-button-toggle-group>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</form>
