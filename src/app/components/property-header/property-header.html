<div class="property-header">
  <div class="property-name">
    <h1 class="property-name-title">{{ property().name }}</h1>
    <h1>·</h1>
    <h1 class="property-rating">
      {{ rating() | number:'1.1-1' }}
    </h1>
  </div>
  <h3 class="property-location">
    <mat-icon class="location-icon">location_on</mat-icon>
    {{ location() }}
  </h3>
</div>
