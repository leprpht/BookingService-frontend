<!-- Loading state -->
@if (loading()) {
  <div class="page-loading">
    <mat-spinner diameter="48" />
    <p>Loading property details…</p>
  </div>
}

<!-- Error state -->
@if (!loading() && error()) {
  <div class="empty-state">
    <mat-icon class="empty-icon">error_outline</mat-icon>
    <h2>Something went wrong</h2>
    <p>{{ error() }}</p>
  </div>
}

<!-- Content -->
@if (!loading() && !error()) {
  <div class="details-page">
    <div class="details-top-bar">
      <button mat-icon-button class="back-btn" (click)="goBack()" matTooltip="Back">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <p
          role="button"
          tabindex="0"
          (click)="goBack()"
          (keyup.enter)="goBack()"
          class="details-title"
        >
          {{ propertyName }}
        </p>
    </div>

    <div class="details-content">
      <booking-service-unit-header
        [unitHeaderData]="headerData()"
        [dates]="dates()"
      ></booking-service-unit-header>
    </div>
  </div>
}
