<div class="unit-header">
  <div class="unit-name">
    <h1 class="unit-name-title">{{ name }}</h1>
    <h1>·</h1>
    <h1 class="unit-price">${{ price | number: '1.0-0' }}</h1>
    <h5 class="days-count">for {{ daysCount }} {{ daysCount === 1 ? 'night' : 'nights' }}</h5>
  </div>
  <div class="unit-details">
    <div class="details-item">
      <mat-icon>straighten</mat-icon>
      <h4 class="unit-size">{{ size }} m²</h4>
    </div>
    <div class="details-item">
      <mat-icon>people</mat-icon>
      <h4 class="unit-capacity">
        {{ capacity }}
      </h4>
    </div>
    <div class="details-item">
      <mat-icon>event</mat-icon>
      <h4
        class="stay-period"
        (click)="searchByDates()"
        (keyup.enter)="searchByDates()"
        role="button"
        tabindex="0"
      >
        {{ from | date: 'MMM d, y' }} - {{ to | date: 'MMM d, y' }}
      </h4>
    </div>
  </div>
</div>
