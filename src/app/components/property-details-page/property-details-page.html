<!-- Loading state -->
@if (loading()) {
  <div class="page-loading">
    <mat-spinner diameter="48" />
    <p>Loading property details…</p>
  </div>
}

<!-- Error state -->
@if (!loading() && error()) {
  <div class="empty-state">
    <mat-icon class="empty-icon">error_outline</mat-icon>
    <h2>Something went wrong</h2>
    <p>{{ error() }}</p>
    <button mat-flat-button (click)="goBack()">Go back home</button>
  </div>
}

<!-- Content -->
@if (!loading() && !error() && property()) {
  <div class="details-page">
    <div class="breadcrumb-bar">
      <button mat-icon-button class="back-btn" (click)="goBack()" matTooltip="Back">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <span class="breadcrumb-path">
        <p
          role="button"
          tabindex="0"
          (click)="searchByLocation()"
          (keyup.enter)="searchByLocation()"
          class="breadcrumb-element"
        >
          {{ locationLabel() }}
        </p>
        <mat-icon class="sep-icon">chevron_right</mat-icon>
        <p
          role="button"
          tabindex="0"
          (click)="searchByProperty()"
          (keyup.enter)="searchByProperty()"
          class="breadcrumb-element"
        >
          {{ property()!.name }}
        </p>
      </span>
    </div>

    <div class="content-layout">
      <div class="left-col">
        <booking-service-property-header [property]="property()!" />
        <booking-service-property-gallery [pictures]="property()!.pictures" />
        <booking-service-property-description [property]="property()!" />
        <booking-service-property-units-list
          [units]="property()!.units"
          [nightsCount]="nightsCount()"
          [dateRangeLabel]="dateRangeLabel()"
          [period]="period()"
          (bookUnit)="bookUnit($event)"
        />
      </div>
    </div>
  </div>
}
